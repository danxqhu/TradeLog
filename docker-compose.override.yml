# =============================================================================
# 本地开发热更新层
# 使用方式：docker-compose -f docker-compose.yml -f docker-compose.override.yml up -d
# =============================================================================

services:
  # 后端：nodemon 热更新
  tradelog-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend/src:/app/src
      - ./backend/.env:/app/.env
    environment:
      NODE_ENV: development
      DB_HOST: tradelog-mysql
    ports:
      - "3001:3001"  # 本地开发映射端口，方便直接调试

  # 前端：Vite HMR 热更新
  tradelog-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    environment:
      NODE_ENV: development
    ports:
      - "5173:5173"  # 本地开发映射端口

  # MySQL 开发时也映射端口，方便用本地工具连接
  tradelog-mysql:
    ports:
      - "3307:3306"  # 映射到3307避免与本地MySQL冲突
