# TradeLog 股票交易助手 —— tradelog.meallog.eu.cc
# 二级域名：tradelog.meallog.eu.cc
# 证书：复用泛域名证书 *.meallog.eu.cc（与 MealLog 相同，无需新增）
# ⚠️ Cloudflare DNS 记录必须保持橙色云朵（代理开启）

server {
    listen 443 ssl;
    server_name tradelog.meallog.eu.cc;

    # 泛域名证书（SSL 终止只在总代理完成，业务容器不接触证书）
    ssl_certificate     /etc/nginx/cert/meallog.eu.cc.crt;
    ssl_certificate_key /etc/nginx/cert/meallog.eu.cc.key;

    # 现代 TLS 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 转发到 TradeLog 前端容器（nginx 托管静态资源 + 代理 API）
    # 使用 docker-compose 服务名 tradelog-frontend，网络内置 DNS 解析
    location / {
        proxy_pass http://tradelog-frontend:80;
        proxy_http_version 1.1;

        # 传递真实客户端信息与原始协议
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 每日追资金：板块/成分股接口需同步等 Python 拉外部数据，需放宽读超时
    # （前缀最长匹配，本 location 优先于上面的 location /）
    # 注：Cloudflare 橙色云朵代理下，免费计划上行请求上限约 100s，超出仍会被 CF 断开
    location /api/money-chase/ {
        proxy_pass http://tradelog-frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    # API 代理到后端（SSE 事件流需要长连接支持）
    # TradeLog 前端 nginx 已经做了 /api → backend 的代理，
    # 但总代理也可以直接转发到前端容器，由前端 nginx 再转后端
    # 这里统一走前端容器入口，保持架构一致
    location /api/market/events {
        proxy_pass http://tradelog-frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接：关闭缓冲、设置超长超时
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
    }
}
